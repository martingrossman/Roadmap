<!doctype html>
<html><head><meta charset="utf-8"><title>Roadmap Sheet harness</title>
<style>html,body{margin:0;height:100%}iframe{border:0;width:100%;height:100%;display:block}</style>
</head><body>
<!-- Test-only: runs the real Code.gs against an in-memory fake Sheet and loads doGet()'s page in a frame. -->
<script src="mock-gas.js"></script>
<script>
  const x = new XMLHttpRequest(); x.open('GET', '../src/Code.gs?' + Date.now(), false); x.send();
  const s = document.createElement('script'); s.textContent = x.responseText; document.head.appendChild(s);
  window.openApp = function () {
    const html = doGet().getContent().replace('<head>', '<head><script>window.google=parent.google;<\/script>');
    let f = document.querySelector('iframe');
    if (f) f.remove();
    f = document.createElement('iframe'); f.srcdoc = html; document.body.appendChild(f);
    return 'opened';
  };
  openApp();
</script>
</body></html>
